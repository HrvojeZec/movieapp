name: Pull request

# pull_request_target runs in the context of the base branch, so the token can label and assign
# PRs. This workflow must never check out or run code from the PR branch.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The PR title becomes the squash commit message, so it must follow Conventional Commits.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    name: Label by branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  assign:
    name: Assign author
    if: github.event.action == 'opened' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR_NUMBER" --add-assignee "$PR_AUTHOR"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
