version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zagreb
    # Same 7-day delay as `min-release-age` in .npmrc (security updates are not delayed)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    assignees: [HrvojeZec]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    assignees: [HrvojeZec]
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
